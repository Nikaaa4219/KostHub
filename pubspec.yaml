name: flutter_application_2
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- ICONS ---
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.7.0

  # --- UTILITIES ---
  provider: ^6.1.1
  intl: ^0.19.0
  http: ^1.2.0        # Versi Baru (Wajib untuk Firebase)
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.2

  # --- MAPS (UPGRADE KE V6) ---
  flutter_map: ^6.1.0 # Versi ini COCOK dengan http ^1.2.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  url_launcher: ^6.2.0

  # --- FIREBASE ---
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^4.14.0
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/PNG-KostHub/Logo_SplashScreen.png
    - assets/images/PNG-KostHub/Hotel1.png
    - assets/images/PNG-KostHub/Hotel2.png
    - assets/images/PNG-KostHub/Hotel3.png
    - assets/images/PNG-KostHub/Hotel4.png