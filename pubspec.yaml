name: flutter_application_2
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- ICONS ---
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.3
  font_awesome_flutter: ^10.7.0

  # --- UTILITIES & UI PACKAGES ---
  provider: ^6.1.5+1
  intl: ^0.19.0
  gap: ^3.0.1
  dotted_line: ^3.2.3  # Kita gunakan versi 3.2.3 resmi yang sudah mendukung Null Safety penuh
  http: ^1.6.0        
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5

  # --- MAPS (UPGRADE KE V6) ---
  flutter_map: ^6.2.1 
  latlong2: ^0.9.1
  geolocator: ^10.1.1
  url_launcher: ^6.3.2

  # --- FIREBASE & SESSION ---
  firebase_core: ^4.9.0
  cloud_firestore: ^6.4.1
  webview_flutter: ^4.13.0
  firebase_auth: ^6.5.1
  d_session: ^0.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/PNG-KostHub/Logo_SplashScreen.png
    - assets/images/PNG-KostHub/Hotel1.png
    - assets/images/PNG-KostHub/Hotel2.png
    - assets/images/PNG-KostHub/Hotel3.png
    - assets/images/PNG-KostHub/Hotel4.png
    - assets/images/PNG-KostHub/Promo1.png
    - assets/images/PNG-KostHub/Promo2.png
    - assets/images/PNG-KostHub/Promo3.png
    - assets/images/PNG-KostHub/Negara1.png
    - assets/images/PNG-KostHub/Negara2.png
    - assets/images/PNG-KostHub/Negara3.png
    - assets/images/PNG-KostHub/Negara4.png
    - assets/images/PNG-KostHub/Negara5.png
    - assets/images/PNG-KostHub/Negara6.png